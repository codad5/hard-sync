name: Release

on:
  release:
    types: [created]
  # Rebuild and attach the binaries for an existing release (e.g. after fixing
  # this workflow). Builds the code at that tag, not at the branch head.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v1.1.0"
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Every build names its target explicitly, so file names always match the
      # CPU they run on. (macos-latest is an Apple Silicon runner: building
      # without --target there produces arm64, not x86_64.)
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            cli_out: hsync-windows-x86_64.exe

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
            cli_out: hsync-linux-x86_64

          # Apple Silicon (M1 and later)
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
            cli_out: hsync-macos-aarch64

          # Intel Macs, cross-compiled on the Apple Silicon runner
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: ""
            cli_out: hsync-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── CLI ────────────────────────────────────────────────────────────────

      - name: Build CLI
        run: cargo build --release -p hsync --target ${{ matrix.target }}

      - name: Rename CLI binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/hsync${{ matrix.exe }}" "${{ matrix.cli_out }}"

      - name: Upload CLI binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.cli_out }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Desktop (Tauri) ────────────────────────────────────────────────────

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: ui
        run: npm install

      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: hard-sync ${{ inputs.tag || github.ref_name }}
          args: --target ${{ matrix.target }}
          releaseDraft: false
          prerelease: false
